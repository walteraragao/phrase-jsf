<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Analisador de Frases</title>
</h:head>
<h:body>

    <h:form>
        <p:panel header="Digite sua Frase">
            <p:inputTextarea value="#{phraseBean.input}" rows="3" cols="60" />
            <p:commandButton value="Analisar" action="#{phraseBean.analyze}" update="result" />
        </p:panel>

        <p:panel header="Resultado" id="result">
            <h:outputText value="Palavras distintas #{phraseBean.result.distinctWords}" />
            <p:dataTable value="#{phraseBean.result.wordOccurrences.entrySet()}" var="entry">
                <p:column headerText="Palavra">
                    <h:outputText value="#{entry.key}" />
                </p:column>
                <p:column headerText="Ocorrências">
                    <h:outputText value="#{entry.value}" />
                </p:column>
            </p:dataTable>
        </p:panel>
    </h:form>
</h:body>
</html>
